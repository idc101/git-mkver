name: Git Mkver Build

# Trigger on every main branch push, version tag push, and pull request
on:
  push:
    branches:
      - main
      - patch-*
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-on-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test
      - name: Build
        run: .\build-windows.ps1
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: git-mkver-windows
          path: target\release\git-mkver-windows-amd64-*.zip

  build-on-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test
      - name: Build
        run: ./build-linux.sh
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: git-mkver-linux
          path: target/git-mkver-linux-*.tar.gz

  build-on-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Test
        run: cargo test
      - name: Build
        run: ./build-macos.sh
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: git-mkver-darwin
          path: target/git-mkver-darwin-*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-on-windows
      - build-on-linux
      - build-on-mac
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/git-mkver-windows-amd64-*.zip
            artifacts/git-mkver-linux-*.tar.gz
            artifacts/git-mkver-darwin-*.tar.gz
          generate_release_notes: true
