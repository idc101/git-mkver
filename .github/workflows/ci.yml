name: Git Mkver Build

# Trigger on every master branch push and pull request
on:
  push:
    branches:
      - master
      - patch-*
  pull_request:
    branches:
      - master

jobs:
  build-on-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test
      - name: Build
        run: .\build-windows.ps1
      - name: Upload binary
        uses: actions/upload-artifact@v3
        with:
          name: git-mkver-windows
          path: target\release\git-mkver-windows-amd64-*.zip
  build-on-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test
      - name: Build
        run: ./build-linux.sh
      - name: Upload binary
        uses: actions/upload-artifact@v3
        with:
          name: git-mkver-linux
          path: target/git-mkver-linux-*.tar.gz
  build-on-mac-x64:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test
      - name: Build
        run: ./build-macos.sh
      - name: Upload binary
        uses: actions/upload-artifact@v3
        with:
          name: git-mkver-darwin
          path: target/git-mkver-darwin-*.tar.gz
