[package]
name = "git-mkver"
version = "2.0.0"
edition = "2021"
authors = ["idc101@users.noreply.github.com"]
description = "Automatic Semantic Versioning for git based software development"
license = "MIT"

[dependencies]
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
hocon = { version = "0.9", default-features = false, features = ["serde-support"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.10"
