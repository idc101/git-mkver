# We won't set most of the defaults, the application defaults are fine
defaults {
  patches: [
    Cargo
    Installers
    RustVersion
  ]
}
patches: [
  {
    name: Cargo
    filePatterns: ["Cargo.toml"]
    replacements: [
      {
        find: "version\\s*=\\s*\"{VersionRegex}\""
        replace: "version = \"{Version}\""
      }
    ]
  }
  {
    name: Installers
    filePatterns: [
      "docs/installation.md"
      "etc/Formula/git-mkver.rb"
      "etc/scoop/git-mkver.json"
      "etc/shell/install.sh"
    ]
    replacements: [
      {
        find: "{VersionRegex}"
        replace: "{Version}"
      }
    ]
  }
  {
    name: RustVersion
    filePatterns: [
      "src/lib.rs"
    ]
    replacements: [
      {
        find: "pub const GIT_MKVER_VERSION: &str = \"{VersionRegex}\";"
        replace: "pub const GIT_MKVER_VERSION: &str = \"{Version}\";"
      }
    ]
  }
]
